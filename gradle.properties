# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version=2.2.0
maven_group=net.raphdf201
archives_name=oppickaxes
enabled_platforms=fabric,neoforge

# Minecraft properties
minecraft_version=26.1.2
# Advertised in the mod metadata and jar names; the mod is built against minecraft_version (the oldest supported)
supported_versions=26.1.2-26.3

# Dependencies
architectury_api_version=20.1.17
fabric_loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2
neoforge_version=26.1.2.115

# Lets Loom accept Architectury API jars that were built with a newer Loom
loom.ignoreDependencyLoomVersionValidation=true
